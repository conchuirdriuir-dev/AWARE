<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-label="The body is where its trajectory sits in code-space" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>The body is where its trajectory sits in code-space</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7781"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6fd6"/></marker>
  </defs>
  <rect width="760" height="476" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">The body is where its trajectory sits in code-space</text>

  <rect x="24" y="56" width="712" height="128" rx="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="1.25"/>
  <text x="40" y="80" font-weight="600" fill="#1f2328">Code-space (morphospace): the monitor's environment</text>
  <circle cx="230" cy="130" r="9" fill="#d4e3fa" stroke="#2f6fd6" stroke-width="2"/>
  <text x="214" y="134" text-anchor="end" font-size="11.5" fill="#1f2328">Body: current code</text>
  <path d="M244 130H544" fill="none" stroke="#6e7781" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="394" y="120" text-anchor="middle" font-size="11.5" fill="#57606a">error: the gap that drives action</text>
  <circle cx="560" cy="130" r="10" fill="#fbe0cf" stroke="#d9612b" stroke-width="2"/>
  <text x="560" y="166" text-anchor="middle" font-size="11.5" fill="#1f2328">Goal code: the setpoint</text>

  <path d="M230 270V142" fill="none" stroke="#2f6fd6" stroke-width="1.25" marker-end="url(#b)"/>
  <text x="242" y="210" font-size="11.5" fill="#57606a">fits</text>

  <rect x="24" y="224" width="712" height="128" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="40" y="248" font-weight="600" fill="#1f2328">Meaning-space (the tissue)</text>
  <polyline points="150,300 190,286 230,276 270,290 310,282" fill="none" stroke="#2f6fd6" stroke-width="1.25"/>
  <circle cx="150" cy="300" r="4" fill="#2f6fd6"/><circle cx="190" cy="286" r="4" fill="#2f6fd6"/><circle cx="230" cy="276" r="4" fill="#2f6fd6"/><circle cx="270" cy="290" r="4" fill="#2f6fd6"/><circle cx="310" cy="282" r="4" fill="#2f6fd6"/>
  <text x="340" y="290" font-size="11.5" fill="#57606a">trajectory: one point per turn</text>

  <rect x="232" y="384" width="296" height="48" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="380" y="412" text-anchor="middle" fill="#1f2328">Environment of the actor: world and owner</text>
  <path d="M380 384V356" fill="none" stroke="#6e7781" stroke-width="1.25" marker-end="url(#a)"/>
  <text x="392" y="374" font-size="11.5" fill="#57606a">input, tagged by provenance</text>
  <text x="24" y="460" font-size="11.5" fill="#57606a">The monitor is a sense organ of the same creature: what the actor's trajectory fits is what it senses.</text>
</svg>
